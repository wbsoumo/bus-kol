<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- WIMT Style Bus Front Emblem -->
  <rect x="8" y="10" width="32" height="28" rx="6" fill="#00695C" stroke="#004D40" stroke-width="2"/>
  <!-- Roof cap -->
  <path d="M12 10 Q24 6 36 10" fill="#004D40"/>
  <!-- Front Windshield -->
  <rect x="11" y="14" width="26" height="11" rx="2" fill="#E0F2F1"/>
  <line x1="24" y1="14" x2="24" y2="25" stroke="#00695C" stroke-width="1.5"/>
  <!-- Destination Board -->
  <rect x="15" y="8" width="18" height="4" rx="1" fill="#FFB300"/>
  <!-- Headlights -->
  <circle cx="14" cy="30" r="2.5" fill="#FFF9C4" stroke="#FFA000" stroke-width="1"/>
  <circle cx="34" cy="30" r="2.5" fill="#FFF9C4" stroke="#FFA000" stroke-width="1"/>
  <!-- Front Grille -->
  <line x1="19" y1="29" x2="29" y2="29" stroke="#E0F2F1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="28" y2="32" stroke="#E0F2F1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bumper -->
  <rect x="10" y="34" width="28" height="3" rx="1.5" fill="#263238"/>
  <!-- Wheels -->
  <rect x="10" y="37" width="5" height="4" rx="1" fill="#212121"/>
  <rect x="33" y="37" width="5" height="4" rx="1" fill="#212121"/>
</svg>

